{% extends "test.html" %}

{% block title %}
    Emails
{% endblock %}

{% block main %}
    <h1>Inbox</h1>
    <div>
        {% for email in emails %}
        <div class ="list-group-item">
            <h6>From:{{ email.sender }}</h6>
            <h2>{{ email.subject}} </h2>
            <p>{{ email.timestamp }}</p>
            <form action="email" method="post">
                <input type="hidden" name="email_id" value="{{ email.id }}">
                <input type="submit" class="btn btn-info" value="View Email">
            </form>
        </div>

        {% endfor %}
    </div>
{% endblock %}
